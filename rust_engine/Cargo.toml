[workspace]
members = [
    "sports-core",
    "sports-book",
    "sports-state",
    "sports-exec",
    "sports-risk",
    "sports-journal",
    "sports-cli",
]
resolver = "2"

[workspace.dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
