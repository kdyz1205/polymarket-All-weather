name: Polymarket Auto Trader

on:
  schedule:
    - cron: '* * * * *'  # Every 1 minute
  workflow_dispatch:
    inputs:
      mode:
        description: 'Trading mode'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - dry-run
          - trade
          - mm-dry
          - mm-live

concurrency:
  group: polymarket-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install py-clob-client requests python-dotenv

      - name: Create data directories
        run: mkdir -p data/cache data/trades data/features micro_live_logs

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: |
            data/cache/
            data/trades/
            data/features/
          key: trading-state-${{ github.run_number }}
          restore-keys: trading-state-

      - name: Run trader
        env:
          POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'scan' }}"
          echo "Mode: $MODE | Time: $(date)"

          case "$MODE" in
            scan)
              python run_auto.py --scan
              ;;
            dry-run)
              python run_auto.py --dry
              ;;
            trade)
              python run_auto.py
              ;;
            mm-dry)
              python market_maker.py --auto --dry --cycles 100
              ;;
            mm-live)
              python market_maker.py --auto --cycles 100
              ;;
          esac

      - name: Show results
        if: always()
        run: |
          echo "=== Portfolio ==="
          python -c "
          import json, os
          for f in ['data/trades/positions.json', 'data/trades/mm_state.json']:
              if os.path.exists(f):
                  with open(f) as fh: print(json.dumps(json.load(fh), indent=2))
          " || true
          echo "=== Trade Log ==="
          tail -20 data/trades/trades.jsonl 2>/dev/null || echo "No trades yet"
          echo "=== MM Log ==="
          tail -20 data/trades/mm_log.jsonl 2>/dev/null || echo "No MM activity yet"

      - name: Save state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-${{ github.run_number }}
          path: |
            data/trades/
            data/cache/
          retention-days: 30
