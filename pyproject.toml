[project]
name = "polymarket-all-weather"
version = "0.1.0"
description = "Multi-market AI-driven quantitative trading panel with dynamic factor engineering"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "websockets>=12.0",
    "aiohttp>=3.9",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "redis>=5.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "ruff>=0.2"]

[tool.ruff]
line-length = 100
target-version = "py311"
